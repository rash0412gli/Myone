<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff2f8">
  <meta name="description" content="Garage gift card landing page demo.">
  <title>GARAGE | $500 Gift Card</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="particles" aria-hidden="true"></div>

  <aside class="notification" aria-label="Simulated demo activity" hidden>
    <span class="notification-icon" aria-hidden="true">🛍️</span>
    <div class="notification-copy">
      <p><strong class="notification-name"></strong> claimed $500!</p>
      <span class="demo-label">Winner!!!</span>
    </div>
  </aside>

  <main class="gift-card">
    <header class="card-header">
      <h1>GARAGE</h1>
      <span class="brand-underline" aria-hidden="true"></span>
    </header>

    <section class="reward" aria-label="$500 Garage gift card">
      <p class="reward-amount">$500</p>
      <p class="reward-label">GARAGE GIFT CARD</p>
    </section>

    <ol class="steps" aria-label="How to claim your reward">
      <li><span class="step-number" aria-hidden="true">1</span><span>Click The Button Below</span></li>
      <li><span class="step-number" aria-hidden="true">2</span><span>Enter Your Basic Info</span></li>
      <li><span class="step-number" aria-hidden="true">3</span><span>Complete 4 to 5 Deals</span></li>
      <li><span class="step-number" aria-hidden="true">4</span><span>Claim Your Reward</span></li>
    </ol>

    <a class="claim-button" href="https://giftclick.org/?offer_id=3857&aff_id=172306">CLAIM YOUR $500 NOW <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
